services:
  - type: web
    name: express-app
    env: node
    buildCommand: npm install
    startCommand: npm start
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: '*'
      - path: /*
        name: Access-Control-Allow-Methods
        value: 'GET,POST,PUT,PATCH,OPTIONS,DELETE'
      - path: /*
        name: Access-Control-Allow-Headers
        value: '*'
